# Builds the Android app on every push to main (or on demand):
#  - an installable APK for testing on your phone (attached to a GitHub pre-release), and
#  - an AAB for Google Play (attached to the same release and kept as a workflow artifact).
# Release builds are signed with the private upload key stored in GitHub secrets
# (ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD).
# If those secrets are missing the build is signed with the public debug key and clearly labelled "testing only".
# Third-party actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them updated.
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      apk: ${{ steps.out.outputs.apk }}
      aab: ${{ steps.out.outputs.aab }}
      version: ${{ steps.out.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
      apk_sha256: ${{ steps.out.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Production dependency audit (report only)
        run: npm audit --omit=dev || true

      - name: Generate the Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check the release configuration
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node .github/scripts/check-native-config.js android

      - name: Prepare the upload key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
            echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
            echo "signed=private-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Upload key secrets are not set. This build is signed with the public debug key: testing only, not for Google Play."
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Open-source cache provider (a thin wrapper over actions/cache) instead of the proprietary default.
          cache-provider: basic

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify the signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice::APK signing certificate SHA-256: $CERT"
          # (The output values avoid the word "upload": GitHub hides job outputs that match a secret, such as the key alias.)
          # SHA-256 of the public React Native debug keystore.
          DEBUG_CERT="fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"
          if [ "${{ steps.sign.outputs.signed }}" = "private-key" ] && [ "$CERT" = "$DEBUG_CERT" ]; then
            echo "::error::Upload key secrets are set but the APK is still signed with the debug key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/upload-key.p12"

      - name: Check the APK installs cleanly
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Every signature scheme must verify (v2/v3 are what Android 7+ checks at install time).
          "$BT/apksigner" verify -v "$APK" | tee "$RUNNER_TEMP/sig.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/sig.txt" \
            || { echo "::error::APK is not signed with scheme v2."; exit 1; }
          # Uncompressed native libraries must be 16 KB page aligned, otherwise Android rejects the package as invalid.
          "$BT/zipalign" -c -P 16 4 "$APK" || { echo "::error::APK is not zip-aligned."; exit 1; }
          # The manifest must parse and carry the expected package, version and ABIs.
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='${{ github.run_number }}'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::Unexpected versionCode in the APK."; exit 1; }
          grep -q "arm64-v8a" "$RUNNER_TEMP/badging.txt" || { echo "::error::APK has no arm64 native code."; exit 1; }
          echo "::notice::$(head -1 "$RUNNER_TEMP/badging.txt")"

      - name: Name the outputs
        id: out
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SUFFIX=$([ "${{ steps.sign.outputs.signed }}" = "debug-key" ] && echo "-debug-signed" || echo "")
          APK="driving-guide-${VERSION}-build${{ github.run_number }}${SUFFIX}.apk"
          # The AAB name says it is for Google Play: phones cannot install .aab files.
          AAB="driving-guide-${VERSION}-build${{ github.run_number }}${SUFFIX}-google-play-only.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          echo "::notice::APK $(du -h "$APK" | cut -f1), AAB $(du -h "$AAB" | cut -f1)"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.aab }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-build-${{ github.run_number }}

      # The APK published to the release must be byte-identical to the one checked above.
      - name: Re-check the downloaded APK
        env:
          APK: ${{ needs.build.outputs.apk }}
          EXPECTED: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          ls -l
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::APK changed in transit ($ACTUAL != $EXPECTED)."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK"
          echo "::notice::APK SHA-256 $ACTUAL"

      - name: Publish test release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (v${{ needs.build.outputs.version }})
          prerelease: true
          body: |
            **On your phone, download the `.apk` file** (not the `.aab`) and open it to install. Needs Android 7.0 or newer.
            If an older test build is installed, uninstall it first.

            - `${{ needs.build.outputs.apk }}`: install on a phone. SHA-256 `${{ needs.build.outputs.apk_sha256 }}`
            - `${{ needs.build.outputs.aab }}`: upload to Google Play Console only. Phones cannot open it.

            ${{ needs.build.outputs.signed == 'private-key' && 'Signed with the private upload key.' || 'Signed with the public DEBUG key: for testing only, not for Google Play.' }}
          files: |
            ${{ needs.build.outputs.apk }}
            ${{ needs.build.outputs.aab }}
