# Builds the Android app on every push to main (or on demand):
#  - an installable APK for testing on your phone (attached to a GitHub pre-release), and
#  - an AAB for Google Play (attached to the same release and kept as a workflow artifact).
# Release builds are signed with the private upload key stored in GitHub secrets
# (ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD).
# If those secrets are missing the build is signed with the public debug key and clearly labelled "testing only".
# Third-party actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them updated.
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      apk: ${{ steps.out.outputs.apk }}
      aab: ${{ steps.out.outputs.aab }}
      version: ${{ steps.out.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Production dependency audit (report only)
        run: npm audit --omit=dev || true

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check the release configuration
        run: node .github/scripts/check-native-config.js android

      - name: Prepare the upload key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
            echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
            echo "signed=upload" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Upload key secrets are not set. This build is signed with the public debug key: testing only, not for Google Play."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify the signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice::APK signing certificate SHA-256: $CERT"
          # SHA-256 of the public React Native debug keystore.
          DEBUG_CERT="fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"
          if [ "${{ steps.sign.outputs.signed }}" = "upload" ] && [ "$CERT" = "$DEBUG_CERT" ]; then
            echo "::error::Upload key secrets are set but the APK is still signed with the debug key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/upload-key.p12"

      - name: Name the outputs
        id: out
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SUFFIX=$([ "${{ steps.sign.outputs.signed }}" = "debug" ] && echo "-debug-signed" || echo "")
          APK="driving-guide-${VERSION}-build${{ github.run_number }}${SUFFIX}.apk"
          AAB="driving-guide-${VERSION}-build${{ github.run_number }}${SUFFIX}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          echo "::notice::APK $(du -h "$APK" | cut -f1), AAB $(du -h "$AAB" | cut -f1)"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.aab }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-build-${{ github.run_number }}

      - name: Publish test release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (v${{ needs.build.outputs.version }})
          prerelease: true
          body: |
            ${{ needs.build.outputs.signed == 'upload' && 'Signed with the private upload key.' || 'Signed with the public DEBUG key: for testing only, not for Google Play.' }}
            - `.apk`: download on your phone and open it to install.
            - `.aab`: upload this one to Google Play Console.
          files: |
            ${{ needs.build.outputs.apk }}
            ${{ needs.build.outputs.aab }}
