# Builds an installable test APK on every push to main (or on demand) and attaches it to a GitHub Release.
# The APK is signed with the Android debug key: fine for testing on your phone, not for Google Play.
name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="driving-guide-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (v${{ steps.apk.outputs.version }})
          prerelease: true
          body: |
            Test APK for Android phones. Download the .apk below on your phone and open it to install.
            Signed with a debug key, for testing only (not for Google Play).
          files: ${{ steps.apk.outputs.name }}
