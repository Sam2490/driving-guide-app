# Builds the iOS app for the iOS Simulator on a macOS runner. This proves the iOS version compiles and
# gives a .app you can drag onto a Mac's Simulator. Installing on a real iPhone needs an Apple Developer
# account (signing) — see docs/IOS.md.
name: iOS simulator build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx jest --ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the iOS Simulator
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Package the .app
        id: app
        run: |
          APP=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="driving-guide-ios-simulator-${VERSION}-build${{ github.run_number }}.zip"
          (cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/$NAME" "$(basename "$APP")")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.name }}
